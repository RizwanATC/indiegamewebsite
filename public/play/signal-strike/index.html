<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0f0a" />
    <title>Signal Strike</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="screen">
      <canvas id="game" tabindex="0" aria-label="Signal Strike, a side-scrolling space shooter. Arrow keys move, Space fires, X fires a special weapon, Enter starts."></canvas>
    </div>
    <div id="touch" aria-hidden="true">
      <div id="stick"><div id="knob"></div></div>
      <div id="buttons">
        <button id="btn-special" type="button" tabindex="-1">SP</button>
        <button id="btn-fire" type="button" tabindex="-1">FIRE</button>
      </div>
      <button id="btn-pause" type="button" tabindex="-1">II</button>
    </div>
    <script src="game.js"></script>
  </body>
</html>
