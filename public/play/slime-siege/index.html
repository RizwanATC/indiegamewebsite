<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1d2b1a" />
    <title>Slime Siege</title>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <div id="screen">
      <canvas id="game" tabindex="0" aria-label="Slime Siege, a vertical fantasy shooter. Arrow keys or WASD move, Space attacks, X uses a special, P pauses, Enter starts. On touch screens, drag anywhere to move."></canvas>
    </div>
    <div id="touch" aria-hidden="true">
      <button id="btn-special" type="button" tabindex="-1">BLOOM</button>
      <button id="btn-pause" type="button" tabindex="-1">II</button>
    </div>
