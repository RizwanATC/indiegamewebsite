# Builds the Signal Strike Android app (a WebView around the same game files
# the website serves) and publishes the APK as a GitHub Release asset:
#   https://github.com/<owner>/<repo>/releases/download/signal-strike-latest/signal-strike.apk
#
# Optional signing secrets (recommended, so updates install over old versions):
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/play/signal-strike/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  TAG: signal-strike-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; the APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk signal-strike.apk
          SHA=$(sha256sum signal-strike.apk | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$(du -k signal-strike.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: signal-strike-apk
          path: signal-strike.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Signal Strike for Android, build ${{ github.run_number }} from ${GITHUB_SHA::7}.

          SHA-256: \`${{ steps.apk.outputs.sha }}\` (${{ steps.apk.outputs.size }} KB)

          Install: download signal-strike.apk on your phone, open it, and allow installs from your browser when Android asks."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Signal Strike (Android)" --notes "$NOTES"
          else
            gh release create "$TAG" --title "Signal Strike (Android)" --notes "$NOTES" --latest=false --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" signal-strike.apk --clobber
