# Builds the Android apps (a WebView around the same game files the website
# serves), one APK per game, and publishes them on the GitHub Release
# "android-latest":
#   https://github.com/<owner>/<repo>/releases/download/android-latest/slime-siege.apk
# The repository must be public for visitors to download them.
#
# Optional signing secrets (recommended, so updates install over old versions):
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/play/slime-siege/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: android-latest

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; the APKs are signed with a temporary debug key."
          fi

      - name: Build release APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p apk
          for game in slime-siege; do
            gradle -p android clean assembleRelease -Pgame=$game --no-daemon --stacktrace
            cp android/app/build/outputs/apk/release/app-release.apk apk/$game.apk
            echo "$game.apk SHA-256: $(sha256sum apk/$game.apk | cut -d' ' -f1) ($(du -k apk/$game.apk | cut -f1) KB)" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apk/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="INDIE/24 Android apps, build ${{ github.run_number }} from ${GITHUB_SHA::7}.

          $(cd apk && sha256sum *.apk)

          Install: download the APK on your phone, open it, and allow installs from your browser when Android asks."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "INDIE/24 games for Android" --notes "$NOTES"
          else
            gh release create "$TAG" --title "INDIE/24 games for Android" --notes "$NOTES" --latest=false --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" apk/*.apk --clobber
