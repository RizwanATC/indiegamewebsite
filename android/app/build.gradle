plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub
// Action from repository secrets). Without them the release APK is signed
// with the throwaway debug key, which installs fine but can't be updated in
// place by a build signed with a different key.
def ks = System.getenv('SIGNING_KEYSTORE_PATH')

// One project, one APK per game: gradle assembleRelease -Pgame=slime-siege
// The game folder under public/play/ is bundled as the app's assets.
def GAMES = [
    'slime-siege'  : [id: 'com.indie24.slimesiege',   label: 'Slime Siege',   orientation: 'sensorPortrait'],
]
def game = (project.findProperty('game') ?: 'slime-siege').toString()
def cfg = GAMES[game]
if (cfg == null) throw new GradleException("Unknown game '${game}'. Pick one of: ${GAMES.keySet().join(', ')}")

android {
    namespace 'com.indie24.game'
    compileSdk 35

    defaultConfig {
        applicationId cfg.id
        manifestPlaceholders = [appLabel: cfg.label, orientation: cfg.orientation]
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    // The game itself is the exact same HTML/JS the website serves.
    sourceSets {
        main {
            assets.srcDirs += ["../../public/play/${game}"]
            res.srcDirs += ["src/${game}/res"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
